spring:
  application:
    name: 4guard-wms-be
  profiles:
    default: local

  # ── Redis auto-config excluded globally; managed manually via RedisConfig ──
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  # ── JSON serialization ─────────────────────────────────────────────────────
  jackson:
    time-zone: UTC
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  tomcat:
    threads:
      max: 15          # Sintonizado para 0.5 vCPU — evita context-switching excesivo
      min-spare: 2
    accept-count: 50   # Cola de peticiones bajo picos de carga
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,application/javascript,text/css
    min-response-size: 1024  # Comprimir sólo respuestas > 1 KB
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# ── SpringDoc / Swagger UI ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  default-produces-media-type: application/json
  show-actuator: false
  cache:
    disabled: false  # Cachea el spec OpenAPI generado — evita re-inspección en cada petición

# ── Cache (Redis desacoplado) ─────────────────────────────────────────────────
cache:
  redis:
    enabled: false
# ── Security CORS ─────────────────────────────────────────────────────────
security:
  cors:
    allowed-origins:
      - "http://localhost:4200"
      - "http://localhost:4201"
      - "http://localhost:8080"
      - "http://127.0.0.1:4200"
      - "http://127.0.0.1:4201"
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
      - "https://*.ngrok-free.dev"
      - "https://*.onrender.com"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - "*"
    allow-credentials: true

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging global ────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.springframework.security: INFO
